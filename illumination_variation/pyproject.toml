[project]
name = "illumination-variation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ojas", email = "OjasD025@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "typer>=0.27.2",
    "vismatch>=1.3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
    "scikit-image>=0.26.0",
    "tabulate>=0.9.0",
]

[project.scripts]
illumination-variation = "illumination_variation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
